[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data298a-causal-planner"
version = "0.1.0"
description = "Reproducible matched nuPlan planner experiments"
requires-python = ">=3.9"
# Fast validation and CLI help use the standard library.
# Simulation and outcome dependencies remain pinned in infra/docker/.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["causal_planner*"]
