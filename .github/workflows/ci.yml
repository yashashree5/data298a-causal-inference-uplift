# Fast checks on every PR to main, and on pushes to main.
# Linux and Windows. A failing step fails the check so branch protection can block the merge.
name: CI

# Quoted so YAML 1.1 parsers (and our workflow unit test) do not treat `on` as a boolean.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: |
          # Retain the existing map-test exclusions (Linear 298-39 / PR #30).
          # Re-enable them after checking both supported CI platforms.
          python -m pytest -q \
            --deselect tests/test_extract_map_features.py::AssemblyPropertyTests::test_missing_indicators_and_row_coverage \
            --deselect tests/test_extract_map_features.py::BuildCliTests::test_end_to_end_build

      - name: mini_68 validator
        run: python -m tools.validate_scenario_subset

      - name: Notebook and schema JSON
        run: |
          python -c "import json; json.load(open('notebooks/nuplan_mini_eda.ipynb', encoding='utf-8'))"
          python -c "import json; json.load(open('configs/features/feature_schema.json', encoding='utf-8'))"
